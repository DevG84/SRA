    <line x1="175" y1="215" x2="305" y2="215" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="175" y1="245" x2="275" y2="245" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    
    <circle cx="190" cy="295" r="12" fill="none" stroke="#10b981" stroke-width="4" />
    <path d="M184 295 L189 300 L197 290" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="215" y1="295" x2="305" y2="295" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
    
    <g transform="rotate(-20 270 270)">
      <path d="M300 200 L325 200 L325 340 L300 340 Z" fill="url(#pencilGrad)" />
