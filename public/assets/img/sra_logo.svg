    <line x1="80" y1="320" x2="130" y2="280" />
    <circle cx="80" cy="320" r="5" fill="#3b82f6" />
    <circle cx="130" cy="280" r="5" fill="#06b6d4" />
  </g>

  <g transform="translate(10, 5)">
    <rect x="140" y="110" width="200" height="270" rx="12" fill="#ffffff" />
    
    <g transform="translate(175, 145)" fill="url(#techGrad)">
      <rect x="0" y="15" width="12" height="15" rx="2" />
      <rect x="18" y="5" width="12" height="25" rx="2" />
      <rect x="36" y="0" width="12" height="30" rx="2" />
